    <style>
        /* Define un contenedor con ancho máximo para la cuadrícula */
        .content-container {
            max-width: 1400px;
            margin: 0 auto; 
        }
        
        /* Estilos de Cuadrícula */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 40px; /* Mayor espacio para que se note la inclinación */
            padding: 2rem;
            min-height: 0 !important;
        }
        
        /* ESTILO DE ARCHIVADOR para cada foto (project-item) */
        .project-item {
            position: relative;
            padding: 10px; /* Relleno alrededor de la foto */
            background: var(--color-background); 
            border: 3px solid var(--color-primary); 
            box-shadow: 6px 6px 0px var(--color-primary); /* Sombra de ficha */
            cursor: pointer; /* Indica que es clicable para Lightbox */
            
            /* CLAVE: Transiciones para el enderezamiento */
            transition: all 0.2s ease, transform 0.3s ease; 
        }
        
        /* Hover: Enderezar y levantar */
        .project-item:hover {
            transform: translate(0, -5px) rotate(0deg) !important; 
            box-shadow: 10px 10px 0px var(--color-primary);
            z-index: 50; 
        }
        
        /* Ajuste de Imágenes */
        .project-item img {
            width: 100%;
            height: auto;
            max-height: none; 
            display: block;
            margin: 0;
            border: none;
            cursor: pointer;
        }

        /* Diseño Llamativo: Fotos que ocupan 2 filas */
        .span-2-rows {
            grid-row: span 2; 
        }
        
        /* 🟢 ESTILOS LIGHTBOX (Galería Modal) */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lightbox.visible {
            display: flex;
            opacity: 1;
        }

        .lightbox-content-wrapper {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .lightbox-content-wrapper img {
            max-width: 100%;
            max-height: 90vh;
            display: block;
            object-fit: contain;
        }

        .lightbox-close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            background: none;
            border: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            z-index: 1010;
            opacity: 0.8;
        }
        
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #fff;
            font-size: 3rem;
            cursor: pointer;
            padding: 0 20px;
            z-index: 1010;
        }

        .lightbox-prev {
            left: 0;
        }

        .lightbox-next {
            right: 0;
        }
    </style>
</head>
