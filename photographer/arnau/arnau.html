<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Fotógrafo - Interactiva</title>
    
    <link rel="stylesheet" href="styles.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>

    <style>
        body {
            /* Reglas CRÍTICAS para el movimiento libre: anulan el Flexbox global */
            overflow: hidden;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* El contenedor del enlace <a>, que es el elemento interactivo */
        .interactive-sticker {
             /* Anula la regla global 'display: inline-block' y permite la posición absoluta */
             display: block !important;
             user-select: none;
        }

        /* El contenedor que realmente se mueve y hace el zoom */
        .movable-resizable-container {
            position: absolute;
            width: 250px; /* Tamaño inicial */
            height: 250px; /* Tamaño inicial */
            cursor: grab;
            overflow: hidden;
            /* Transición desactivada aquí para que JS la controle (panstart/panend) */
            will-change: transform;
        }

        /* La imagen PNG dentro del contenedor */
        .movable-resizable-container img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain; /* Perfecto para PNGs silueteados */
        }
    </style>
</head>
<body class="interactive-page">

    <a href="arnau.html" id="imageLink_arnau" class="interactive-sticker">
        <div class="movable-resizable-container" id="imageContainer_arnau">
            <img src="sticker_arnau.png" alt="Sticker Arnau - Clic para ver sesión">
        </div>
    </a>

    <script src="script.js"></script>
</body>
</html>
