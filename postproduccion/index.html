<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javier Botella Pérez</title>
    <!-- Busca el archivo CSS que está afuera en la raíz -->
    <link rel="stylesheet" href="../styles.css">
</head>
<body>

    <!-- CABECERA (Ruta directa a la página de inicio de la raíz) -->
    <header class="main-header">
        <h1><a href="../index.html">Javier Botella Pérez</a></h1>
    </header>

    <!-- REJILLA DE PROYECTOS -->
    <main class="projects-grid-container">
        <div class="projects-grid">
            
            <!-- Los bloques <div class="project-item"> de tus vídeos van aquí dentro -->
            <!-- Puedes mantener los mismos que tenías en cada respectivo archivo -->

        </div>
    </main>

    <!-- MENÚ INFERIOR SIMPLIFICADO -->
    <nav class="minimal-menu">
        <a href="../index.html" class="menu-item">Portfolio</a>
        <span class="menu-separator">•</span>
        <a href="../produccion/index.html" class="menu-item" id="menu-prod">Production</a>
        <span class="menu-separator">•</span>
        <a href="../postproduccion/index.html" class="menu-item" id="menu-post">Postproduction</a>
        <span class="menu-separator">•</span>
        <a href="../aboutme.html" class="menu-item">About</a>
    </nav>

    <!-- NUEVA INTERFAZ EDITORIAL PARA PROYECTOS (VÍDEO + CRÉDITOS EXTENDIDOS) -->
    <div id="projectLightbox" class="custom-editorial-lightbox">
        <button class="editorial-close-btn" id="closeProjectBtn">CLOSE</button>
        
        <div class="editorial-container">
            <!-- Bloque Izquierdo: Reproductor de Vídeo -->
            <div class="editorial-video-wrapper">
                <video id="projectLightboxVid" controls style="display: block; width: 100%; height: auto; object-fit: contain;"></video>
            </div>
            
            <!-- Bloque Derecho: Ficha Técnica / Créditos -->
            <div class="editorial-meta-wrapper">
                <h2 id="editorialTitle"></h2>
                <div id="editorialCredits" class="editorial-credits-list">
                    <!-- Los párrafos técnicos se inyectarán dinámicamente aquí -->
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE NAVEGACIÓN E INYECCIÓN DE CRÉDITOS -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const grid = document.querySelector(".projects-grid");
            const lightbox = document.getElementById("projectLightbox");
            const lightboxVid = document.getElementById("projectLightboxVid");
            const closeBtn = document.getElementById("closeProjectBtn");
            const editorialTitle = document.getElementById("editorialTitle");
            const editorialCredits = document.getElementById("editorialCredits");
            
            // Iluminar el botón del menú activo según la carpeta en la que estemos
            const isPost = window.location.pathname.includes("postproduccion");
            if (isPost) {
                document.getElementById("menu-post").style.color = "#000000";
            } else {
                document.getElementById("menu-prod").style.color = "#000000";
            }

            // 1. Convertimos los proyectos en una lista y los barajamos
            const projects = Array.from(grid.children);
            
            function shuffle(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }
            
            const shuffledProjects = shuffle(projects);
            
            // 2. Vaciamos el grid y volvemos a meterlos en el nuevo orden aleatorio
            grid.innerHTML = "";
            shuffledProjects.forEach(project => grid.appendChild(project));

            // 3. Activamos la escucha de clics e inyección de textos
            const projectItems = document.querySelectorAll(".project-item");

            projectItems.forEach(item => {
                item.addEventListener("click", () => {
                    const videoSrc = item.dataset.video;
                    
                    // Extraer título y párrafos de créditos de la tarjeta clicada
                    const originalTitle = item.querySelector(".project-info h3").innerText;
                    const originalParagraphs = item.querySelectorAll(".project-info p");
                    
                    // Inyectar datos en la interfaz limpia
                    editorialTitle.innerText = originalTitle;
                    
                    editorialCredits.innerHTML = ""; // Limpiar registros anteriores
                    originalParagraphs.forEach(p => {
                        const newP = document.createElement("p");
                        newP.innerHTML = p.innerHTML;
                        editorialCredits.appendChild(newP);
                    });

                    // Lanzar reproductor
                    lightboxVid.src = videoSrc;
                    lightbox.classList.add("active");
                    lightboxVid.play();
                });
            });

            function close() {
                lightbox.classList.remove("active");
                lightboxVid.pause();
                lightboxVid.src = "";
                editorialTitle.innerText = "";
                editorialCredits.innerHTML = "";
            }

            closeBtn.onclick = close;
            lightbox.onclick = close;
            // Evitar que el visor se cierre si clicas dentro de la estructura de contenido
            document.querySelector(".editorial-container").onclick = (e) => e.stopPropagation();
        });
    </script>
</body>
</html>
