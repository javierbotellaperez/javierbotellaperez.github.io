                <a href="index.html" class="nav-link">home</a>&nbsp;&nbsp;|&nbsp;&nbsp;

    <main class="content-container contact-page">
        <h2 style="text-align: center; margin-bottom: 2.5rem;">CONTACT</h2>

        <div class="contact-form-wrapper">
            
            <p class="contact-intro">
                For project inquiries, collaborations, or general questions, please use the form below or email me directly.
            </p>

            <form action="#" method="POST" class="contact-form">
                
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </div>
                
                <button type="submit" class="submit-btn">Send Message</button>
            </form>

            <div class="social-links-area">
                <p class="social-title">Follow me:</p>
                <div class="social-links">
                    
                    <a href="https://instagram.com/__javibotella" target="_blank" class="social-link">
                        📸 
                    </a>
                    
                    <a href="https://bsky.app/profile/javibotella.bsky.social" target="_blank" class="social-link">
                        🦋
                    </a>
                    
                    <a href="https://letterboxd.com/javibotella" target="_blank" class="social-link">
                        🟠🟢🔵
                    </a>
                    
                </div>
            </div>
            
        </div>
        
    </main>
