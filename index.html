<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javier Botella Pérez - Portfolio</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

    <div class="carousel-container row-photos">
        <div class="carousel-track scroll-left" id="photoTrack"></div>
    </div>

    <div class="carousel-container row-videos">
        <div class="carousel-track scroll-right" id="videoTrack"></div>
    </div>

    <div class="lightbox" id="lightbox">
        <button class="close-btn" id="closeBtn">&times;</button>
        
        <button class="lightbox-btn prev" id="lightboxPrev">&#10094;</button>
        
        <div class="lightbox-content">
            <img src="" alt="Visor Foto" id="lightboxImg">
            <video src="" id="lightboxVid" controls autoplay></video>
        </div>

        <button class="lightbox-btn next" id="lightboxNext">&#10095;</button>
    </div>

    <script src="/script.js"></script>
</body>
</html>
