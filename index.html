<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javier Botella Pérez - Portfolio</title>
    <link rel="stylesheet" href="/styles.css">
    
    <style>
        /* ==========================================
           NORMAS DE DISEÑO PARA EL LIGHTBOX Y CRÉDITOS
           ========================================== */

        /* Contenedor principal del Visor (Fondo Limpio) */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff; /* Estética blanca y minimalista */
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .lightbox.active {
            opacity: 1;
        }

        /* Distribución en dos columnas: Contenido a un lado, Créditos al otro */
        .lightbox-content-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            width: 85%;
            max-width: 1200px;
            gap: 40px;
        }

        /* Columna Izquierda: Contenido (Imagen o Vídeo) en relación de aspecto nativa */
        .lightbox-content {
            flex: 1.6;
            aspect-ratio: 16 / 9;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #lightboxImg, #lightboxVid {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }
        
        /* Ocultar dinámicamente según lo que cargue tu script.js */
        #lightboxImg[src=""], #lightboxVid[src=""] {
            display: none;
        }
        
        /* Columna Derecha: Créditos con tipografía de la web */
        .lightbox-credits {
            flex: 1;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .lightbox-credits h3 {
            font-size: 24px !important;
            margin: 0 0 10px 0 !important;
            font-weight: normal !important;
            color: #000000 !important;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .lightbox-credits p {
            font-size: 14px !important;
            margin: 4px 0 !important;
            color: #666666 !important;
            line-height: 1.5;
        }

        /* Bloque sutil para separar visualmente los créditos extra */
        .extra-credits-wrapper {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
        }

        /* Botón de Cierre (X) superior derecho */
        .close-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            background: none;
            border: none;
            color: #000000;
            font-size: 40px;
            font-weight: 300;
            cursor: pointer;
            z-index: 10000;
            transition: opacity 0.2s ease;
        }
        .close-btn:hover { opacity: 0.5; }

        /* Flechas Laterales de Navegación */
        .lightbox-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #000000;
            font-size: 45px;
            font-weight: 300;
            cursor: pointer;
            padding: 20px;
            z-index: 10000;
            user-select: none;
            transition: opacity 0.2s ease;
        }
        .lightbox-btn:hover { opacity: 0.5; }
        .prev { left: 30px; }
        .next { right: 30px; }

        /* Adaptabilidad para pantallas móviles (Pasa a formato vertical de una columna) */
        @media (max-width: 900px) {
            .lightbox-content-container {
                flex-direction: column;
                gap: 25px;
                width: 90%;
            }
            .lightbox-credits {
                text-align: center;
                align-items: center;
            }
            .lightbox-btn { font-size: 35px; padding: 10px; }
            .prev { left: 10px; }
            .next { right: 10px; }
            .close-btn { top: 20px; right: 20px; font-size: 35px; }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <h1><a href="index.html" style="color: inherit; text-decoration: none;">Javier Botella Pérez</a></h1>
    </header>

    <div class="carousel-container row-photos" id="containerPhotos">
        <div class="row-hover-zone zone-left"></div>
        <div class="row-hover-zone zone-right"></div>
        <div class="carousel-track" id="photoTrack"></div>
    </div>

    <div class="carousel-container row-videos" id="containerVideos">
        <div class="row-hover-zone zone-left"></div>
        <div class="row-hover-zone zone-right"></div>
        <div class="carousel-track" id="videoTrack"></div>
    </div>

    <nav class="minimal-menu">
        <a href="index.html" class="menu-item" style="color: #000000;">Portfolio</a>
        <span class="menu-separator">•</span>
        <a href="produccion/index.html" class="menu-item">Production</a>
        <span class="menu-separator">•</span>
        <a href="postproduccion/index.html" class="menu-item">Postproduction</a>
        <span class="menu-separator">•</span>
        <a href="aboutme.html" class="menu-item">About</a>
    </nav>

    <!-- LIGHTBOX MAQUETADO EN DOS COLUMNAS COHERENTE -->
    <div class="lightbox" id="lightbox">
        <button class="close-btn" id="closeBtn" aria-label="Cerrar">&times;</button>
        <button class="lightbox-btn prev" id="lightboxPrev" aria-label="Anterior">&#10094;</button>
        
        <div class="lightbox-content-container">
            <!-- LADO 1: CONTENIDO SÍNCRONO -->
            <div class="lightbox-content">
                <img src="" alt="Visor Foto" id="lightboxImg">
                <video src="" id="lightboxVid" controls autoplay></video>
            </div>
            <!-- LADO 2: CONTENEDOR DE CRÉDITOS -->
            <div id="lightboxCredits" class="lightbox-credits"></div>
        </div>
        
        <button class="lightbox-btn next" id="lightboxNext" aria-label="Siguiente">&#10095;</button>
    </div>

    <script src="/script.js"></script>
</body>
</html>
