<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javier Botella Pérez — Producción</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>

    <header class="main-header">
        <h1><a href="../index.html">Javier Botella Pérez</a></h1>
    </header>

    <main class="projects-grid-container">
        <h2 class="section-title">Producción</h2>

        <div class="projects-grid">
            
            <div class="project-item" data-video="videos/prod_video_01.mp4">
                <img src="thumbs/prod_thumb_01.jpg" alt="Proyecto Producción 1" class="project-thumb">
                <div class="project-info">
                    <h3>Proyecto Producción 1</h3>
                    <p>Videoclip / 2026</p>
                </div>
            </div>

            <div class="project-item" data-video="videos/prod_video_02.mp4">
                <img src="thumbs/prod_thumb_02.jpg" alt="Proyecto Producción 2" class="project-thumb">
                <div class="project-info">
                    <h3>Proyecto Producción 2</h3>
                    <p>Publicidad / 2026</p>
                </div>
            </div>

            <div class="project-item" data-video="videos/prod_video_03.mp4">
                <img src="thumbs/prod_thumb_03.jpg" alt="Proyecto Producción 3" class="project-thumb">
                <div class="project-info">
                    <h3>Proyecto Producción 3</h3>
                    <p>Ficción / 2025</p>
                </div>
            </div>

        </div>
    </main>

    <nav class="minimal-menu">
        <a href="index.html" class="menu-item" style="color: #000000;">Producción</a>
        <span class="menu-separator">•</span>
        <a href="../postproduccion/index.html" class="menu-item">Postproducción</a>
        <span class="menu-separator">•</span>
        <a href="../about.html" class="menu-item">About</a>
    </nav>

    <div id="projectLightbox" class="lightbox">
        <button class="close-btn" id="closeProjectBtn">&times;</button>
        <div class="lightbox-content">
            <video id="projectLightboxVid" controls></video>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const lightbox = document.getElementById("projectLightbox");
            const lightboxVid = document.getElementById("projectLightboxVid");
            const closeBtn = document.getElementById("closeProjectBtn");
            const projectItems = document.querySelectorAll(".project-item");

            projectItems.forEach(item => {
                item.addEventListener("click", () => {
                    const videoSrc = item.dataset.video;
                    lightboxVid.src = videoSrc;
                    lightbox.classList.add("active");
                    lightboxVid.play();
                });
            });

            function close() {
                lightbox.classList.remove("active");
                lightboxVid.pause();
                lightboxVid.src = "";
            }

            closeBtn.onclick = close;
            lightbox.onclick = close;
            lightboxVid.onclick = (e) => e.stopPropagation();
        });
    </script>
</body>
</html>
