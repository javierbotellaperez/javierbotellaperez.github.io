<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Fotógrafo - Interactiva</title>
    
    <link rel="stylesheet" href="styles.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>

   <style>
        body {
            /* REFORZADO: Asegura que el punto de inicio (0,0) esté justo en la esquina */
            overflow: hidden;
            margin: 0 !important; /* Refuerza la anulación de márgenes */
            padding: 0 !important; /* Refuerza la anulación de padding */
        }
        
        .movable-resizable-container {
            position: absolute;
            width: 250px;
            height: 250px;
            cursor: grab;
            user-select: none;
            overflow: hidden;
            
            /* 🔥 IMPORTANTE: Transición eliminada para evitar conflictos con JS */
            will-change: transform;
        }

        .movable-resizable-container img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }
        
        /* Asegura que el enlace no se comporte como inline */
        .interactive-sticker {
             display: block !important;
        }
    </style>
</head>
<body class="interactive-page">

    <a href="arnau.html" id="imageLink_arnau" class="interactive-sticker">
        <div class="movable-resizable-container" id="imageContainer_arnau">
            <img src="sticker_arnau.png" alt="Sticker Arnau - Clic para ver sesión">
        </div>
    </a>

    <script src="script.js"></script>
</body>
</html>
