<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Fotógrafo - Interactiva</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>

    <style>
        /* Estilos base del body */
        body {
            overflow: hidden; /* Importante para que las imágenes no generen scroll */
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        /* --- ESTILOS DEL CONTENEDOR INTERACTIVO --- */
        .movable-resizable-container {
            /* 'position: absolute' es CLAVE para la manipulación con JS */
            position: absolute;
            width: 250px; /* Tamaño inicial */
            height: 250px; /* Tamaño inicial */
            cursor: grab;
            user-select: none;
            overflow: hidden;
            /* La transición CSS permite que el zoom y la liberación sean fluidos */
            transition: transform 0.3s ease-out, width 0.3s ease-out, height 0.3s ease-out;
            will-change: transform; /* Optimización de rendimiento */
        }

        /* Estilos para la imagen (PNG Silueteado) */
        .movable-resizable-container img {
            width: 100%;
            height: 100%;
            display: block;
            /* object-fit: contain; es mejor para siluetas, asegura que toda la imagen quepa */
            object-fit: contain;
        }
    </style>
</head>
<body>

    <a href="arnau.html" id="imageLink_arnau">
        <div class="movable-resizable-container" id="imageContainer_arnau">
            <img src="sticker_arnau.png" alt="Sticker Arnau - Clic para ver sesión">
        </div>
    </a>

    <script src="script.js"></script>
</body>
</html>
